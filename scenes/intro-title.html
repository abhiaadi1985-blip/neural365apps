<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intro Title - neural365 COMMUNITY</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #090D16;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #F9FAFB;
      position: relative;
    }

    /* Ambient lighting */
    .glow-cyan {
      position: absolute;
      top: 15%;
      left: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.16) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .glow-indigo {
      position: absolute;
      bottom: 20%;
      right: 25%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.14) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .hero-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 120px;
    }

    .badge-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 22px;
      border-radius: 9999px;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      opacity: 0;
    }

    .main-title {
      font-size: 76px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      background: linear-gradient(135deg, #FFFFFF 40%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      opacity: 0;
    }

    .main-title span {
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-text {
      font-size: 26px;
      font-weight: 500;
      color: #9CA3AF;
      max-width: 980px;
      line-height: 1.45;
      letter-spacing: -0.01em;
      margin-bottom: 40px;
      opacity: 0;
    }

    .pillars-strip {
      display: flex;
      gap: 16px;
      opacity: 0;
    }

    .pill-card {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      color: #E2E8F0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body data-composition-id="intro-title" data-width="1920" data-height="1080" data-duration="10.0">
  <div class="glow-cyan"></div>
  <div class="glow-indigo"></div>
  <div class="grid-lines"></div>

  <div class="hero-container clip" data-start="0" data-duration="10.0">
    <div class="badge-pill" id="badge">⚡ EXECUTIVE BUILDER KEYNOTE</div>
    <h1 class="main-title" id="title">Mastering Enterprise AI at <span>neural365</span></h1>
    <p class="sub-text" id="sub">An independent open laboratory bridging Microsoft Learn, Copilot Multi-Agents & Autonomous ERP with Human-in-the-Loop verification.</p>
    
    <div class="pillars-strip" id="strip">
      <div class="pill-card">◈ D365 F&O RECONCILIATION</div>
      <div class="pill-card">◈ DATAVERSE VIRTUAL TABLES</div>
      <div class="pill-card">◈ COPILOT MULTI-AGENTS</div>
      <div class="pill-card">◈ THE PULSE RADAR</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["intro-title"] = tl;

    // Phase 1: Badge spring in
    tl.fromTo("#badge",
      { opacity: 0, y: -20, scale: 0.9 },
      { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.5)" },
      0.3
    );

    // Phase 2: Main title reveal
    tl.fromTo("#title",
      { opacity: 0, y: 30, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 1.0, ease: "power4.out" },
      0.6
    );

    // Phase 3: Subtitle fade
    tl.fromTo("#sub",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
      1.1
    );

    // Phase 4: Pillars strip stagger
    tl.fromTo("#strip .pill-card",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.5, stagger: 0.12, ease: "power2.out" },
      1.5
    );

    // Subtle breathing drift
    tl.to(".hero-container", {
      scale: 1.02,
      duration: 7.0,
      ease: "sine.out"
    }, 2.0);
  </script>
</body>
</html>
